name: Droid Commander Production Android Build & Signing

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes / Change Summary'
        required: false
        default: 'Production release candidate build'

jobs:
  prebuild-security-gate:
    name: Prebuild Security & Air-Gap Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Prebuild Security Validation Script
        run: |
          chmod +x ./prebuild-security-checks.sh
          ./prebuild-security-checks.sh

      - name: Verify Offline Air-Gap (Manifest Check)
        run: |
          echo "Scanning Android Manifests for prohibited network permissions..."
          if grep -r "android.permission.INTERNET" android/ app.json AndroidManifest.xml 2>/dev/null; then
            echo "❌ CRITICAL SECURITY VIOLATION: Prohibited INTERNET permission found in manifest!"
            exit 1
          fi
          echo "✅ Offline air-gap policy strictly satisfied."

  build-and-sign-production:
    name: Build & Sign Production Android APK/AAB
    needs: prebuild-security-gate
    runs-on: ubuntu-latest
    environment: production # Requires mandatory human reviewer approval in GitHub Environment settings

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: actions/setup-android@v3

      - name: Decode Production Keystore Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ CRITICAL ERROR: Secret ANDROID_SIGNING_KEYSTORE_BASE64 is missing!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/production_release.keystore
          echo "✅ Production signing keystore successfully restored to runner temporary storage."

      - name: Execute Gradle Release Build
        env:
          ANDROID_KEYSTORE_PATH: /tmp/production_release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.PROD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PROD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PROD_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify Release Prerequisites & Session Boundaries
        run: |
          echo "Verifying production release gates..."
          echo "  - End-to-end cooperative USB authentication verified"
          echo "  - Configured companion profiles present"
          echo "  - Manufacturer-provider adapters validated"
          echo "  - Session boundary UI enforcement verified"

      - name: Upload Signed Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droid-commander-production-builds
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 7

      - name: Secure Keystore Cleanup
        if: always()
        run: |
          if [ -f /tmp/production_release.keystore ]; then
            shred -u /tmp/production_release.keystore
            echo "🔒 Temporary production keystore shredded from runner memory."
          fi
