name: Droid Commander Production Android Build, Signing & Security Scanning

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes / Change Summary'
        required: false
        default: 'Production release candidate build'

jobs:
  prebuild-security-gate:
    name: Prebuild Security & Air-Gap Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Prebuild Security Validation Script
        run: |
          chmod +x ./prebuild-security-checks.sh
          ./prebuild-security-checks.sh

      - name: Verify Offline Air-Gap (Manifest Check)
        run: |
          echo "Scanning Android Manifests for prohibited network permissions..."
          if grep -r "android.permission.INTERNET" android/ app.json AndroidManifest.xml 2>/dev/null; then
            echo "❌ CRITICAL SECURITY VIOLATION: Prohibited INTERNET permission found in manifest!"
            exit 1
          fi
          echo "✅ Offline air-gap policy strictly satisfied."

  sast-static-analysis:
    name: SAST Static Security Analysis (Semgrep & Detekt)
    needs: prebuild-security-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js & JDK
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Run Semgrep SAST Scan (TypeScript / React Native)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/typescript

  build-debug-apk:
    name: Build debug APK
    needs: sast-static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript Codebase
        run: npx tsc --noEmit

      - name: Run Jest Test Suite
        run: npm test -- --passWithNoTests

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create temporary debug signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: droid-commander-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-release-apk:
    name: Build signed production release APK
    needs: sast-static-analysis
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/droid-commander-release.keystore
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('manual-{0}', github.run_number) }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: droid-commander-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
