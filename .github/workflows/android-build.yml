name: Android build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_CMAKE: "3.31.5"
  ANDROID_NDK: "27.3.13750724"
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

jobs:
  android-debug:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Android SDK and NDK
        shell: bash
        env:
          INSTALL_SYSTEM_PACKAGES: "0"
          WRITE_PROFILE: "0"
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          chmod +x scripts/setup-android-ci.sh
          scripts/setup-android-ci.sh --verify-only
          # React Native’s generated Gradle catalog asks for 27.1.12297006.
          # Ubuntu 24.04 provides 27.3.13750724; this compatibility link keeps
          # the generated project unchanged while using the verified toolchain.
          ln -sfn "$ANDROID_HOME/ndk/$ANDROID_NDK" "$ANDROID_HOME/ndk/27.1.12297006"
          ln -sfn "$ANDROID_HOME/cmake/$ANDROID_CMAKE" "$ANDROID_HOME/cmake/3.22.1"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "PATH=$PATH"
          } >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript checks
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Validate Gradle wrapper
        working-directory: android
        run: ./gradlew --version

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Generate APK checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/*.apk artifacts/
          sha256sum artifacts/*.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: droid-commander-debug-apk-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK checksum
        uses: actions/upload-artifact@v4
        with:
          name: droid-commander-debug-apk-${{ github.sha }}-sha256
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
